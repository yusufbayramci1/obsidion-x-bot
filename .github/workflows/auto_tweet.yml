name: OBSIDION Auto X Poster

on:
  schedule:
    - cron: '0 8,13,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri Yukle
        run: pip install -r requirements.txt

      - name: Tweet Paylas
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SKIP_JITTER: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python bot.py

      - name: Hafizayi Guncelle
        run: |
          git config --local user.email "bot@obsidion.local"
          git config --local user.name "Obsidion Bot"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted tweet state" && git push)
